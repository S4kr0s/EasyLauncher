name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p easylauncher-core -p ezl

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npx svelte-check --threshold warning
        working-directory: app
      - run: npx tauri build ${{ matrix.args }}
        working-directory: app
        env:
          # Repository variable, once the Microsoft app is approved.
          EASYLAUNCHER_MS_CLIENT_ID: ${{ vars.EASYLAUNCHER_MS_CLIENT_ID }}
          # Signing (optional until certificates exist):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLauncher-${{ matrix.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Pushing a tag like v0.2.0 publishes both installers as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.exe
          generate_release_notes: true
